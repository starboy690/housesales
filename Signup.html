<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        *{
            padding: 0;
            margin: 0;
        }

        .container{
            display: flex;
            width: 100%;

        }


        .leftpart{
            width: 520px;
            background-color: white;
            height: 730px;
            border-radius: 15px;

           
        }

        .leftpart .input-box{
            position: relative;
            width: 100%;
            height: 50px;
            margin-left: 72px;
            margin-top: 33px;
            
        }

        .input-box input{
            width: 50%;
            height: 30%;
            background: transparent;
            border: none;
            border: 2px solid rgba(31, 30, 30, 0.473);
            border-radius: 15px;
            font-size: 18px;
            color: #080808;
            padding: 20px 45px 20px 20px;
            outline: none;
        }

        
        .input-box i{
            position: absolute;
            left: 240px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }
        .container .leftpart{
            margin-left: 37px;
            margin-top: 28px;
        }

        .leftpart h1{
            font-size: 36px;
            text-align: center;
            margin-top: 22px;
        }

        .leftpart .remember-forgot{
            display: flex;
            justify-content: space-evenly;
            font: 14.5px;
            margin-top: 28px;
            margin-left: 15px;
        }

        .remember-forgot a{
            color: rgb(8, 155, 239);
            text-decoration: none;
        }

        .remember-forgot a:hover{
            text-decoration: underline 2px black;
        }

        .remember-forgot label input{
            accent-color: white;
            margin-right: 3px;
        }

        .leftpart .btn{
            width: 70%;
            height: 45px;
            background: linear-gradient(135deg, #3b99d8, #a83030);
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            font-size: 16px;
            cursor: pointer;
            margin-top: 54px;
            margin-left: 57px;
            color: #f6f4f4;
            font-weight: 600;
        }

        .btn:hover{
            transform: scale(1.1);
        }

        .btn i{
            font-size: 12px;
            padding-top: -12px;
        }


        .container .rightpart{
           height: 772px;
           margin-left: 30px;
        }
        .container .rightpart img{
           width: 100%;
          
            height: 100%;
          
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="leftpart">
            <form action="">
                <h1>Registration</h1>
                <div class="input-box">
                <input type="text" placeholder="FirstName">
                <i class="fa-solid fa-user"></i>
                </div>

                <div class="input-box">
                    <input type="text" placeholder="LastName">
                    <i class="fa-solid fa-user"></i>
                    </div>

                
                <div class="input-box">
                <input type="text" placeholder="UserName">
                <i class="fa-solid fa-users-gear"></i>
                </div>

                <div class="input-box">
                    <input type="text" placeholder="Email Address">
                    <i class="fa-solid fa-envelope"></i>
                    </div> 
                    
                    <div class="input-box">
                        <input type="password" placeholder="Password">
                        <i class="fa-solid fa-user-lock"></i>
                        </div> 
                        
                        <div class="input-box">
                   <input type="password" placeholder="Confirm Password">
                      <i class="fa-solid fa-user-lock"></i>
                     </div> 

                     <div class="remember-forgot">
                     <label><input type="checkbox">Remember me</label>
                       <a href="login.html">Have an account already?</a>
                        </div>

                        <button class="btn">
                        SignUp <i class="fa-solid fa-user-plus"></i>
                        </button>
                        
                    




            </form>

        </div>

        <div class="rightpart">
            <img src="sign up.png">
        </div>
    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            height: 100vh;
            background: #EEAECA;
            background: radial-gradient(circle, rgba(238, 174, 202, 1) 0%, rgba(148, 187, 233, 1) 100%);
        }

        .back-video{
            position: absolute;
            z-index: -1;
            object-fit: cover;
            width: 100%;
            height: 70%;
        }

        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            
        }

        .left-part{
            width: auto;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-right: 129px;
            background-color: rgb(250, 204, 244);
            margin-top: 30px;
            border-radius: 28px;
            box-shadow: 10px 10px 20px rgba(158, 158, 158, 0.708);
        }

        h1{
            font-size: 39px;
            color: rgb(64, 61, 57);
            margin-bottom: 25px;
            margin-right: 85px;
           

        }

        h1:before{
            text-decoration: underline 2px ;
        }

       
        

        .inputbox#one{
            width: 350px;
            height: 55px;
            margin-bottom: 12px;
            margin-left: 12px;
        }

        .inputbox#one input{
            width: 95%;
            height: 90%;
            border-radius: 19px;
            border: none;
            outline: none;
            color: rgb(20, 20, 20);
            background: #fcfefefd;
            margin-top: 2px;
            font-size: 16px;
            padding-left: 5px;
            
        }

       
        .inputbox#two{
            margin-top: 15px;
        }

        .inputbox#two input{
            width: 328px;
            height: 102px;
            border-radius: 8px;
            background: #fbf9f999;
            border: none;
            outline: none;
            color: rgb(20, 20, 20);
            font-size: 16px;
            padding-left: 2px;
            margin-right: 10px;

            
           
        }

        

        .right-part{
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 220px;
        }


        .right-part img{
            width: 320px;
            border-radius: 23px;
            box-shadow: 10px 10px 20px rgba(158, 158, 158, 0.708);
        }

        .btn{
            width: 250Px;
            height: 45px;
            margin-top: 28px;
            font-size: 18.5px;
            border: none;
            outline: none;
            border-radius: 22px;
            background:rgb(98, 171, 234);
            cursor: pointer;
            color: white;
            box-shadow: 10px 10px 20px rgba(158, 158, 158, 0.708);
           
        }

        
        .btn i{
            color: aliceblue;
            margin-left: 16px;
            font-size: 21px;
            
          
        }
        .btn:hover{
            transform: scale(1.2);
            background: rgb(36, 36, 216);
        }
    </style>
</head>
<body>

    <video autoplay loop muted plays-inline class="back-video">
        <source src="video.mp4"  type="video/mp4">
    </video>


    <div class="container">
        <form action="" class="left-part">
            <H1>Get in touch <i class="fa-solid fa-headset"></i> </H1> <hr>
           


            <div id="one" class="inputbox">
            <input type="text" placeholder="Firstname">
            </div>
            
            <div id="one" class="inputbox">
                <input type="text" placeholder="Lastname">
                </div>


       <div id="one" class="inputbox">
           <input type="text" placeholder="Email">
           </div>


         <div id="two" class="inputbox">
             <input type="text" placeholder="Message">
              </div>


           <button class="btn" type="submit">Submit<span><i class="fa-solid fa-arrow-right"></i></span></button>   

        </form>
        <div class="right-part">
            <img src="contact.jpg">
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">


    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "poppins", sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: seagreen;
            background: url(login\ page.webp) no-repeat;
            background-size: cover;
           backdrop-filter: blur(2px);
            background-position: center;
        }

        .wrapper{
             width: 420px;
             background-color: transparent;
             color: white;
             border-radius: 10px;
             backdrop-filter: blur(5px);
             box-shadow: 0 0 10px rgba(0, 0, 0, .2);
             border: 4px solid rgba(81, 204, 15, 0.795);
            padding: 30px 40px;

        }

        .wrapper h1{
            font-size: 36px;
            text-align: center;

        }

        .wrapper .input-box{
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;

        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            border: 4px solid rgba(185, 19, 19, 0.473);
            border-radius: 40px;
            font-size: 18px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }

        .input-box input::placeholder{
            color: #fff;
             
        }

        .input-box i{
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;

        }

        .wrapper .remember-forgot{
            display: flex;
            justify-content: space-between;
            font: 14.5px;
            margin: -15px 0 15px;
        }

        .remember-forgot label input{
            accent-color: white;
            margin-right: 3px;
        }

        .remember-forgot a{
            color: white;
            text-decoration: none;
        }

        .remember-forgot a:hover{
            color: rgb(84, 84, 220);
            text-decoration: underline;
        }

        .wrapper .btn{
            width: 100%;
            height: 45px;
            background: #fff;
            border: none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
            font-size: 16px;
            cursor: pointer;
            color: #333;
            font-weight: 600;
        }

        .wrapper .register-link{
            font-size: 14.5px;
            text-align: center;
            margin: 20px 0 15px;
        }

        .register-link p a {
            color: #fff;
            text-decoration: none;
            font-weight: 600;


        }

        .register-link p a:hover{
            text-decoration: underline;
            color: rgb(84, 84, 220);
        }



    </style>
</head>
<body>

    <div class="wrapper">
        <form action="">
            <h1>Login / SignUp</h1>
            <div class="input-box">
                <input type="email" placeholder="email" id="username">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="input-box">
                <input type="password" placeholder="password" id="password">
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="remember-forgot">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button class="btn"  onclick="func(event)"
            >
            Login
            </button>

            <div class="register-link">
                <p>Don't have an account?<a href="Signup.html" target="_blank">Register</a></p>
            </div>
        </form>
    </div>

    <script>
        function func(e){
            e.preventDefault();
            var email = document.getElementById("username").value;
            var pass = document.getElementById("password").value;
            console.log(email,pass)
            if(email == 'emmanuelgiwa80@gmail.com' && pass == '1234561'){
                alert("success full! ")
                window.location.assign("index.html")
            }
            else{
                alert("wrong entry invalid");
            }
        }
    </script>
    
</body>
</html>
